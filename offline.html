<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline | Judes CBO</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1a365d">
    <link rel="icon" href="images/icons/favicon-32.png" type="image/png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: rgba(255,255,255,0.85);
            background: #0f2440;
            background-image: radial-gradient(ellipse at 15% 10%, rgba(45,80,22,0.75), transparent 55%), radial-gradient(ellipse at 90% 100%, rgba(229,62,62,0.25), transparent 50%);
        }
        .card { width: 100%; max-width: 460px; text-align: center; }
        .logo { width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 28px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
        .logo img { width: 74px; height: 74px; }
        .signal { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,0.1); font-size: 14px; font-weight: 600; margin-bottom: 18px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #fc8181; animation: pulse 1.6s infinite; }
        .online .dot { background: #68d391; animation: none; }
        @keyframes pulse { 50% { opacity: .3; } }
        h1 { color: #fff; font-size: 30px; line-height: 1.2; margin-bottom: 12px; }
        p { font-size: 16px; line-height: 1.6; margin-bottom: 26px; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        a, button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; border: none; }
        .primary { background: #e53e3e; color: #fff; }
        .secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .note { margin-top: 26px; font-size: 13px; opacity: .7; }
        @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo"><img src="images/icons/icon-192.png" alt="Judes CBO"></div>
        <span class="signal" id="signal"><span class="dot"></span><span id="signal-text">No internet connection</span></span>
        <h1>You're offline</h1>
        <p>It looks like your connection dropped. Check your data or Wi-Fi and try again. Pages you've already visited may still open.</p>
        <div class="actions">
            <button type="button" class="primary" onclick="location.reload()">Try again</button>
            <a href="tel:+254712109310" class="secondary">Call Judes CBO: +254 712 109310</a>
        </div>
        <p class="note">Judes Community Based Organization · Oyugis, Homa Bay County</p>
    </main>
    <script>
        // Reload automatically when the connection comes back
        window.addEventListener('online', function () {
            document.body.classList.add('online');
            document.getElementById('signal-text').textContent = 'Back online, reloading…';
            setTimeout(function () { location.reload(); }, 800);
        });
    </script>
</body>
</html>
